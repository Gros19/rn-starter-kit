appId: host.exp.Exponent
name: "Tabs & Features Navigation Test"
---

# Expo Go에서 프로젝트 진입
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "rn-starter-kit"
    index: 0
    optional: true

# 온보딩 처리 (이미 완료된 경우 스킵)
- runFlow:
    when:
      visible:
        id: "onboarding-screen-container"
    commands:
      - tapOn:
          id: "onboarding-skip-button"
      - waitForAnimationToEnd

# 홈 화면 대기
- extendedWaitUntil:
    visible:
      id: "home-screen-container"
    timeout: 60000

- takeScreenshot: "maestro/screenshots/10-home"

# 탐색 탭
- tapOn:
    id: "tab-bar-explore-button"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/11-explore"

# 설정 탭
- tapOn:
    id: "tab-bar-settings-button"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/12-settings"

# 홈 복귀
- tapOn:
    id: "tab-bar-home-button"
- waitForAnimationToEnd

# Feature: Todo
- tapOn:
    id: "home-todo-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/13-todo"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 파일 업로드
- tapOn:
    id: "home-upload-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/14-upload"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 알림
- tapOn:
    id: "home-notification-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/15-notification"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 게시판
- scrollUntilVisible:
    element:
      id: "home-board-card"
    direction: DOWN
- tapOn:
    id: "home-board-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/16-board"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 채팅
- scrollUntilVisible:
    element:
      id: "home-chat-card"
    direction: DOWN
- tapOn:
    id: "home-chat-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/17-chat"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 갤러리
- scrollUntilVisible:
    element:
      id: "home-gallery-card"
    direction: DOWN
- tapOn:
    id: "home-gallery-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/18-gallery"
- tapOn:
    id: "features-back-button"
- waitForAnimationToEnd

# Feature: 피드
- scrollUntilVisible:
    element:
      id: "home-feed-card"
    direction: DOWN
- tapOn:
    id: "home-feed-card"
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/19-feed"
